name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -r requirements-dev.txt -c constraints-local-win-py312.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests -q --junitxml=test-results.xml
        env:
          AURA_UI_BROWSER_CHANNEL: chromium
      - run: python -m experiments.accuracy --suite scope --output outputs/ci-scope
      - run: python -m experiments.research_study --output outputs/ci-research/policy-study.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: regression-results
          path: |
            test-results.xml
            outputs/ci-scope
            outputs/ci-research
