# Controlled research deployment: private, authenticated workspaces only.
services:
  - type: web
    name: ai-bi-platform
    runtime: python
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /api/health
    envVars:
      - key: AURA_PUBLIC_DEMO
        value: "false"
      - key: AURA_AUTH_REQUIRED
        value: "true"
      - key: AURA_COOKIE_SECURE
        value: "true"
      - key: AURA_SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
